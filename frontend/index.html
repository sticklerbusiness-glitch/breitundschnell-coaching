<!-- B&S: the WEBSITE's manifest (absolute path, outside the Vite base). Training is one
     screen of one installed app that starts at /app — a manifest of its own would make
     "zum Home-Bildschirm" install a second, competing icon. -->
<link rel="manifest" href="/manifest.webmanifest">
<!-- B&S: Icon-Pfade ABSOLUT (Vite ersetzt %BASE_URL% durch die Base /training/). Die Seite
     wird unter /training OHNE Schrägstrich ausgeliefert — Next leitet jeden Pfad mit
     Schrägstrich am Ende per 308 dorthin um —, ein relatives "icon-180.png" würde dort
     gegen den Domain-Stamm aufgelöst (/icon-180.png, 404) und „Zum Home-Bildschirm"
     bekäme auf iOS einen Screenshot statt des Icons. -->
<link rel="apple-touch-icon" href="%BASE_URL%icon-180.png">
<link rel="icon" type="image/png" href="%BASE_URL%icon-192.png">
